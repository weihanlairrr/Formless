# 推到 main 就在 GitHub 的 Mac 上用模擬器打開編輯器、截圖，截圖放到 ui-check 分支，交付前用來檢查畫面。
name: 畫面檢查

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-check
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: 選擇 Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"

      - name: 建立模擬器
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import sys,json;rs=[r for r in json.load(sys.stdin)['runtimes'] if r['platform']=='iOS' and r['isAvailable']];print(sorted(rs,key=lambda r:[int(x) for x in r['version'].split('.')])[-1]['identifier'])")
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import sys,json
          names=[d['name'] for d in json.load(sys.stdin)['devicetypes']]
          pick=[n for n in names if n=='iPhone Air'] or [n for n in names if n.startswith('iPhone') and 'Pro' in n] or [n for n in names if n.startswith('iPhone')]
          print(pick[-1])")
          UDID=$(xcrun simctl create "畫面檢查" "$TYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "::notice::模擬器 $TYPE（$RUNTIME）"
          xcrun simctl boot "$UDID"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100

      - name: 編譯（模擬器、Debug）
        run: |
          set -o pipefail
          xcodebuild build \
            -project MyWidgetsAPP.xcodeproj -scheme Formless -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: 編譯錯誤
        if: failure()
        run: |
          MSG=$(grep -E "error:" build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -60 | awk '{printf "%s%%0A", $0}')
          echo "::error::$MSG"

      - name: 安裝並放入測試用的設計
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/MyWidgetsAPP.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant all com.weihan.formless || true
          GROUP=$(xcrun simctl get_app_container "$UDID" com.weihan.formless group.com.weihan.formless)
          mkdir -p "$GROUP/Widgets"
          for FAMILY in small medium large; do
            case $FAMILY in small) ID=11111111-0000-0000-0000-000000000001;; medium) ID=11111111-0000-0000-0000-000000000002;; large) ID=11111111-0000-0000-0000-000000000003;; esac
            cat > "$GROUP/Widgets/$ID.formless" <<JSON
          {"id":"$ID","name":"檢查-$FAMILY","family":"$FAMILY","backgroundColorHex":"#F4F4F4","layers":[
            {"id":"aaaaaaaa-0000-0000-0000-00000000000${ID: -1}","name":"標題","type":"text","frame":{"x":0.08,"y":0.08,"width":0.6,"height":0.3},"value":"星期一","fontSize":28,"colorHex":"#E5484D"},
            {"id":"bbbbbbbb-0000-0000-0000-00000000000${ID: -1}","name":"色塊","type":"shape","frame":{"x":0.08,"y":0.5,"width":0.84,"height":0.4},"colorHex":"#DDDDE3","cornerRadius":16}
          ]}
          JSON
          done
          ls -la "$GROUP/Widgets"

      - name: 截圖
        run: |
          mkdir -p shots
          shot() {
            NAME=$1; shift
            xcrun simctl terminate "$UDID" com.weihan.formless 2>/dev/null || true
            xcrun simctl launch "$UDID" com.weihan.formless -FormlessDebugSkipPermissions YES "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$NAME.png"
          }
          shot 1-大型-版面 -FormlessDebugOpen 11111111-0000-0000-0000-000000000003 -FormlessDebugLayer 標題 -FormlessDebugTab 版面
          shot 1b-大型-版面-畫布最高 -FormlessDebugOpen 11111111-0000-0000-0000-000000000003 -FormlessDebugLayer 標題 -FormlessDebugTab 版面 -formless.editorPreviewHeight.large 900 -FormlessDebugTabBarDump YES
          cp "$(xcrun simctl get_app_container "$UDID" com.weihan.formless data)/Documents/tabbar.txt" shots/ || true
          shot 2-中型-版面 -FormlessDebugOpen 11111111-0000-0000-0000-000000000002 -FormlessDebugLayer 標題 -FormlessDebugTab 版面
          shot 3-小型-外觀 -FormlessDebugOpen 11111111-0000-0000-0000-000000000001 -FormlessDebugLayer 標題 -FormlessDebugTab 外觀
          shot 4-大型-清單 -FormlessDebugOpen 11111111-0000-0000-0000-000000000003
          shot 5-大型-小工具設定 -FormlessDebugOpen 11111111-0000-0000-0000-000000000003 -FormlessDebugPanel design
          ls -la shots

      # 實際點分類列切換、錄下來，確認玻璃的切換動畫正常（idb 模擬手指點擊）。
      - name: 錄影（點分類列切換）
        continue-on-error: true
        run: |
          exec > >(tee shots/record-log.txt) 2>&1
          brew install facebook/fb/idb-companion || echo "idb-companion 安裝失敗"
          python3 -m pip install --break-system-packages fb-idb || python3 -m pip install --user fb-idb || echo "fb-idb 安裝失敗"
          export PATH="$PATH:$(python3 -m site --user-base)/bin"
          which idb idb_companion || true
          idb_companion --udid "$UDID" --grpc-port 10882 > shots/companion-log.txt 2>&1 &
          sleep 6
          idb connect localhost 10882 || echo "連線失敗"
          xcrun simctl terminate "$UDID" com.weihan.formless 2>/dev/null || true
          xcrun simctl launch "$UDID" com.weihan.formless -FormlessDebugSkipPermissions YES -FormlessDebugOpen 11111111-0000-0000-0000-000000000003 -FormlessDebugLayer 標題 -FormlessDebugTab 版面 -FormlessDebugTabBarDump YES
          sleep 9
          D="$(xcrun simctl get_app_container "$UDID" com.weihan.formless data)/Documents/tabbar.txt"
          cp "$D" shots/tabbar-switch.txt || true
          read X Y W H <<< "$(python3 -c "import re,sys;l=open(sys.argv[1]).readline();print(*re.search(r'window \(([-0-9.]+), ([-0-9.]+), ([-0-9.]+), ([-0-9.]+)\)',l).groups())" "$D")"
          echo "分類列 $X $Y $W $H"
          xcrun simctl io "$UDID" recordVideo --codec h264 --force shots/switch.mp4 &
          REC=$!
          sleep 2
          for i in 1 2 3 0 2 0; do
            TX=$(python3 -c "print(round(20+($W-40)*($i+0.5)/4))")
            TY=$(python3 -c "print(round($Y+$H/2))")
            idb ui tap --udid "$UDID" "$TX" "$TY" || idb ui tap "$TX" "$TY" || echo "點擊失敗 $TX $TY"
            sleep 1.3
          done
          kill -INT $REC; wait $REC || true
          # 往上捲一段，看捲動中的分類列。
          SX=210; SY1=720; SY2=590
          idb ui swipe --udid "$UDID" --duration 0.6 $SX $SY1 $SX $SY2 || echo "捲動失敗"
          sleep 2
          xcrun simctl io "$UDID" screenshot shots/6-大型-版面-捲動後.png
          echo "::notice::$(tail -c 1500 shots/record-log.txt | tr '\n' ' ')"

      # 備用：App 自己依序切換分類（不經手指），錄下來看玻璃移動。
      - name: 錄影（程式切換分類）
        continue-on-error: true
        run: |
          xcrun simctl terminate "$UDID" com.weihan.formless 2>/dev/null || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force shots/switch-auto.mp4 &
          REC=$!
          sleep 1
          xcrun simctl launch "$UDID" com.weihan.formless -FormlessDebugSkipPermissions YES -FormlessDebugOpen 11111111-0000-0000-0000-000000000003 -FormlessDebugLayer 標題 -FormlessDebugTab 版面 -FormlessDebugCycleTabs YES
          sleep 16
          kill -INT $REC; wait $REC || true
          ls -la shots

      - name: 截圖放到 ui-check 分支
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ui-check
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "$GITHUB_SHA" > commit.txt
          git add -A && git commit -qm "畫面檢查 $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-check
